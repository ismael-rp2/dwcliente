<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
    <!-- Importamos la fuente Cinzel de estilo clásico romano/griego -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #fondo {
            /* Mantenemos el fondo oscuro pero le damos un degradado elegante */
            background: radial-gradient(circle at center, #2c223e 0%, rgb(23, 23, 23) 100%);
            color: #fdf6e3;
            font-family: 'Cinzel', Georgia, serif;
            min-height: 100vh;
            
            /* Centrado total en pantalla */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
       
        h1 {
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 40px;
            /* Efecto dorado en el título */
            background: linear-gradient(45deg, #d4af37, #fff3b0, #aa7c11);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 4px 15px rgba(212, 175, 55, 0.2);
        }

        #primer-div {
            display: flex;
            gap: 25px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        /* Estilo de placas/tarjetas para los nombres */
        #primer-div p {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 15px 35px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #ffffff; /* Borde siempre blanco */
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
        }

        #primer-div p:hover {
            transform: translateY(-5px) scale(1.05);
        }

        /* Colores específicos para cada Rey Mago en el primer div */
        #primer-div .melchor {
            background: linear-gradient(135deg, #1e3a8a, #2563eb); /* Azul */
            color: #ffffff;
        }

        #primer-div .gaspar {
            background: linear-gradient(135deg, #0b5345, #16a085); /* Verde */
            color: #e8f8f5;
        }

        #primer-div .baltasar {
            background: linear-gradient(135deg, #8b0000, #c0392b); /* Rojo */
            color: #fff3b0;
        }

       #segundo-div {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px; /* Espacio de separación entre cada tarjeta abierta */
        }


        /* Mantenemos tu regla original para que tu JS funcione igual */
        .informacion {            
            /* Estilos que se verán cuando tu JS lo haga visible */
            font-size: 1.25rem;
            line-height: 1.7;
            padding: 25px 30px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid #d4af37;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(212, 175, 55, 0.15);
            letter-spacing: 1px;
        }

        p.error {
            background-color: #dc2626; /* Fondo rojo intenso */
            color: #ffffff;            /* Texto blanco para que resalte */
            font-weight: 900;          /* Letra "poderosa" (extra negrita) */
            font-size: 1.15rem;        /* Tamaño ligeramente mayor para dar fuerza */
            text-transform: uppercase; /* Opcional: todo en mayúsculas para mayor impacto */
            letter-spacing: 0.5px;     /* Un poco de espacio entre letras para legibilidad */
            padding: 12px 16px;        /* Espacio interno para que el fondo respire */
            border-radius: 6px;        /* Bordes ligeramente redondeados */
            border: 2px solid #ffffff; /* Borde blanco siguiendo el estilo anterior */
        }

        .oculto {
            display: none;
        }


    </style>
    <script type="module" src="./main.js"></script>
</head>
<body id="fondo">
    <h1>Ejercicio 2</h1>
    
    <div id="primer-div">
        <p class="melchor">Melchor</p>
        <p class="gaspar">Gaspar</p>
        <p class="baltasar">Baltasar</p>
    </div>
    
    <div id="segundo-div">
        <p class="informacion melchor oculto">El rey mayor que ofrece oro, símbolo de realeza y sabiduría.</p>
        <p class="informacion gaspar oculto">El viajero de barba castaña que lleva incienso, signo de fe y oración.</p>
        <p class="informacion baltasar oculto">El rey que entrega mirra, emblema de entrega y generosidad.</p>
    </div>

</body>
</html>
